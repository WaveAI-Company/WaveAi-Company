[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "waveai-api"
version = "0.1.0"
description = "WaveAI — serviço de API (FastAPI): auth, domínio e gateway WS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "argon2-cffi>=23.1",
    "email-validator>=2.0",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "cryptography>=42.0",
    # Narrativa-LLM aterrada (N6-b, ADR-0035). Opcional em runtime: sem
    # ANTHROPIC_API_KEY o gateway usa o sumário determinístico (N5-c).
    "anthropic>=0.40",
    # Foto de perfil (ADR-0050): a imagem recebida é RE-CODIFICADA no servidor —
    # redimensiona, normaliza para JPEG e remove EXIF/GPS. É a re-codificação que
    # mata polyglot e limpa metadado de localização de foto de rosto.
    "pillow>=10.0",
]

[project.optional-dependencies]
# Faixa fechada de propósito: a partir da 0.16 o ruff liga ~416 regras por
# padrão, então trocar de minor muda o que o lint reprova. O CI pina a versão
# exata; aqui basta a faixa para o venv de desenvolvimento.
dev = ["pytest>=7.0", "httpx>=0.27", "ruff>=0.16,<0.17"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
