# Atualização automática de dependências (ADR-0057).
#
# Três coisas, e cada uma tem motivo escrito na ADR:
#
#   - `groups`: uma PR por ecossistema, não uma por pacote. O gargalo do nosso
#     CI não é computação (Actions é gratuito e ilimitado em repo público) — é
#     a fila do Cloudflare Pages, plano free com CONCORRÊNCIA 1. Doze PRs
#     abertas fizeram o preview de uma delas esperar mais de 14 minutos, contra
#     ~2 minutos dos checks do Actions.
#
#   - `open-pull-requests-limit: 3`: o default é 5 POR ecossistema, e com oito
#     ecossistemas isso é um teto de 40 PRs simultâneas. PRs de SEGURANÇA não
#     contam para este limite, então apertá-lo não atrasa correção de
#     vulnerabilidade.
#
#   - `ignore` no npm: ver o bloco do apps/wave-app.
version: 2
updates:
  # GitHub Actions (workflows em .github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"

  # Python — packages/wave-eeg
  - package-ecosystem: "pip"
    directory: "/packages/wave-eeg"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      wave-eeg:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Python — packages/wave-corpus
  - package-ecosystem: "pip"
    directory: "/packages/wave-corpus"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      wave-corpus:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Python — services/api
  - package-ecosystem: "pip"
    directory: "/services/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      api:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Python — services/analysis
  - package-ecosystem: "pip"
    directory: "/services/analysis"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      analysis:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Node — apps/wave-app
  #
  # O `ignore` daqui é a REGRA da ADR-0057: pacote gerenciado pelo SDK do Expo
  # sobe por `npx expo install`, que consulta a matriz de compatibilidade do
  # SDK, e NUNCA por PR automática, que consulta só o registro do npm. Medido
  # em 2026-09-07 com `npx expo install --check`: o SDK 57 espera
  # `react-native@0.86.3` e o Dependabot propôs `0.87.1`; espera
  # `react-native-screens@~4.26.0` e ele propôs `4.27.0`. E o CI não pegaria:
  # o job do app roda `npm ci`, `typecheck`, `check:contrast` e `check:guia` —
  # sem `build:web` e sem build nativo, então um bump de `react-native` fica
  # verde sem que uma linha de React Native tenha rodado.
  #
  # DOIS níveis de rigor, e a diferença é a forma como o Expo escreve a versão
  # (emenda à ADR-0057, medida na PR agrupada #249):
  #
  #   - `expo`, `expo-*`, `@expo/*` estão pinados com `~`, que é o Expo dizendo
  #     "patch pode subir". Ali basta ignorar MAJOR e MINOR: os patches são
  #     exatamente o que o SDK quer, e a PR #249 acertou os dez em cheio
  #     (`expo` -> 57.0.20, `expo-router` -> 57.0.19, ...).
  #
  #   - `react`, `react-dom`, `react-native` e `react-native-*` estão pinados
  #     SEM `~` e SEM `^`, que é o Expo dizendo "é ESTA versão". Ali o PATCH
  #     também desalinha, e isso foi medido: depois da #249 o
  #     `npx expo install --check` reclamava de `react-dom@19.2.8` (esperado
  #     `19.2.3`), `react-native-reanimated@4.5.5` (esperado `4.5.1`),
  #     `react-native-svg@15.15.5` (esperado `15.15.4`) e
  #     `react-native-worklets@0.10.4` (esperado `0.10.1`). Por isso os três
  #     níveis. O custo, assumido: o patch que o SDK QUERIA (`react-native`
  #     0.86.0 -> 0.86.3) também deixa de vir sozinho — quem o traz é o
  #     `npx expo install`, que é o canal certo.
  #
  # Em nenhum dos casos a segurança é afetada: `version-update:*` vale SOMENTE
  # para version updates, e PRs de segurança nem contam para o limite. Ignorar
  # o pacote inteiro (com `versions`) cortaria o canal de segurança junto, e aí
  # a cura seria pior que a doença.
  #
  # O padrão `react-native-*` pega TAMBÉM o que não é do SDK — hoje
  # `react-native-ble-plx` e `react-native-bluetooth-classic`. Isso é
  # intencional e vale dizer em voz alta: são módulos NATIVOS, e nenhum módulo
  # nativo é validado por este CI. Subi-los às cegas é o mesmo risco por outro
  # caminho; quem os sobe tem de fazer um build no EAS para saber.
  #
  # Quando o projeto subir de SDK, esta lista precisa ser revista.
  - package-ecosystem: "npm"
    directory: "/apps/wave-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      wave-app:
        patterns: ["*"]
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Pinados EXATOS pelo Expo: os três níveis (ver o bloco acima).
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # `typescript` só no MAJOR: o TS 7 mudou a API do compilador
      # (`ts.ModuleKind` é `undefined`) e quebra os DOIS geradores do projeto —
      # inclusive o `gerar-legal-estatico.mjs`, que roda dentro do `build:web`,
      # que é o comando do Cloudflare Pages. Um major aqui derruba o deploy do
      # site, não é uma atualização. Minor e patch do TS 6 continuam vindo, e
      # esta linha SAI no dia em que os geradores forem portados para a API
      # nova (emenda à ADR-0057).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Docker — services/api
  - package-ecosystem: "docker"
    directory: "/services/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      docker-api:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Docker — services/analysis
  - package-ecosystem: "docker"
    directory: "/services/analysis"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      docker-analysis:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
