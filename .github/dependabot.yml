version: 2
updates:
  # GitHub Actions (workflows em .github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"

  # Python — packages/wave-eeg
  - package-ecosystem: "pip"
    directory: "/packages/wave-eeg"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Python — packages/wave-corpus
  - package-ecosystem: "pip"
    directory: "/packages/wave-corpus"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Python — services/api
  - package-ecosystem: "pip"
    directory: "/services/api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Python — services/analysis
  - package-ecosystem: "pip"
    directory: "/services/analysis"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Node — apps/wave-app
  - package-ecosystem: "npm"
    directory: "/apps/wave-app"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Docker — services/api
  - package-ecosystem: "docker"
    directory: "/services/api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Docker — services/analysis
  - package-ecosystem: "docker"
    directory: "/services/analysis"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
